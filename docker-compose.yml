services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bookmarked}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookmarked}
      POSTGRES_DB: ${POSTGRES_DB:-bookmarked}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bookmarked}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://bookmarked:bookmarked@db:5432/bookmarked}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-["*"]}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  app:
    image: ghcr.io/cirruslabs/flutter:stable
    working_dir: /app
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8000}
    depends_on:
      - backend
    ports:
      - "5000:5000"
    volumes:
      - ./app:/app
    command: >
      sh -c "flutter pub get &&
             flutter run -d web-server --web-hostname 0.0.0.0 --web-port 5000
             --dart-define=API_BASE_URL=$$API_BASE_URL"

volumes:
  db_data:
