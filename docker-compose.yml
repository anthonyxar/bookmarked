services:
  # Firebase Local Emulator Suite (Auth, Firestore, Storage, Functions) —
  # replaces the old Postgres/FastAPI services entirely now that every domain
  # has been migrated (https://github.com/anthonyxar/bookmarked/issues/4).
  firebase:
    build: ./firebase
    working_dir: /workspace
    # firebase_emulator_data (below) is the CLI's own cache dir, not emulator
    # data, so persisting data across restarts needs a separate volume
    # (firebase_emulator_export) — mounted at .emulator-data, with the actual
    # export/import target one level down at .emulator-data/export: pointing
    # --export-on-exit at the mount point itself fails ("EBUSY: resource busy
    # or locked, rmdir ...") since the CLI tries to rmdir+recreate that
    # directory on every export, which you can't do to a mount point.
    # --import is guarded on a prior export actually existing, since passing
    # it an empty/missing directory errors.
    # The image's ENTRYPOINT is ["firebase"], so this needs clearing to run
    # as a shell script instead — and command must be a 3-element list, not
    # a plain string, or Compose word-splits the script into separate args.
    entrypoint: []
    command:
      - sh
      - -c
      - |
        if [ -f /workspace/.emulator-data/export/firebase-export-metadata.json ]; then
          IMPORT_FLAG="--import=/workspace/.emulator-data/export"
        else
          IMPORT_FLAG=""
        fi
        exec firebase emulators:start --project demo-bookmarked --only auth,firestore,storage,functions --export-on-exit=/workspace/.emulator-data/export $$IMPORT_FLAG
    volumes:
      - ./firebase.json:/workspace/firebase.json
      - ./.firebaserc:/workspace/.firebaserc
      - ./firestore.rules:/workspace/firestore.rules
      - ./firestore.indexes.json:/workspace/firestore.indexes.json
      - ./storage.rules:/workspace/storage.rules
      - ./functions:/workspace/functions
      - ./firestore-tests:/workspace/firestore-tests
      - ./storage-tests:/workspace/storage-tests
      - firebase_emulator_data:/workspace/.firebase
      - firebase_emulator_export:/workspace/.emulator-data
    ports:
      - "4000:4000" # Emulator UI
      - "5001:5001" # Cloud Functions
      - "8080:8080" # Firestore
      - "9099:9099" # Auth
      - "9199:9199" # Storage

  # Android/iOS only now (issue #7) — there's no emulator/device inside this
  # container to run against, so it just stays up as a workspace for ad hoc
  # `docker compose run --rm --no-deps app sh -c "..."` commands (flutter
  # analyze, flutter build apk --debug, etc. — see AGENTS.md). Build an APK
  # this way and sideload it over USB/adb from the host to test on a device.
  app:
    image: ghcr.io/cirruslabs/flutter:stable
    working_dir: /app
    depends_on:
      - firebase
    volumes:
      - ./app:/app
      # Keeps the Android debug signing key stable across container rebuilds —
      # the SHA-1 registered in the Firebase console for Google Sign-In has to
      # match it. Mounting the directory (not the file) means Docker never
      # creates an empty debug.keystore/ folder if the key is missing.
      - ./keystore:/root/.android
    command: sh -c "flutter pub get && tail -f /dev/null"

volumes:
  firebase_emulator_data:
  firebase_emulator_export:
